filebeat.inputs:
  - type: log
    paths:
      - /var/log/ai-proxy/security_*.json
    json.keys_under_root: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "ai-proxy-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.name: "ai-proxy"
setup.template.pattern: "ai-proxy-*"