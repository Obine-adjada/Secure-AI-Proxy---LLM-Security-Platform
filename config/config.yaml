# Configuration Secure AI Proxy
# Proxy settings
proxy:
  host: "0.0.0.0"
  port: 8000
  debug: true
  workers: 4

# LLM Providers
llm_providers:
  openai:
    enabled: true
    api_base: "https://api.openai.com/v1"
    models:
      - "gpt-4"
      - "gpt-3.5-turbo"
  
  anthropic:
    enabled: true
    api_base: "https://api.anthropic.com/v1"
    models:
      - "claude-3-opus-20240229"
      - "claude-3-sonnet-20240229"

security:
  mode: "enforce"  
  actions:
    prompt_injection: "block"     # block | sanitize | allow
    data_leak: "sanitize"         
    jailbreak: "block"            
  # Seuils de détection
  thresholds:
    injection_confidence: 0.3
    dlp_confidence: 0.2
    jailbreak_confidence: 0.3
    
logging:
  level: "INFO"
  elasticsearch:
    enabled: false  
    host: "localhost"
    port: 9200
    index: "ai-proxy-logs"
  
  redis:
    enabled: false  
    host: "localhost"
    port: 6379
    db: 0

rate_limiting:
  enabled: false
  max_requests_per_minute: 100
  max_requests_per_hour: 1000